[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib", "../lib"]
auto_detect_remappings = false
solc_version = "0.8.26"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
gas_limit = 30000000
block_gas_limit = 30000000
ffi = false

[profile.default.fuzz]
runs = 128
seed = "0x4152434849544558"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
arc_mainnet = "https://rpc.mainnet.arc.io"

[fmt]
line_length = 120

[lint]
ignore = ["lib/**", "../lib/forge-std/**"]
